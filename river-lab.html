<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizon — River Geometry Lab 1.2</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10232b;color:#eff8f2}
*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block}
#scene{position:fixed;inset:0}
#header{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none;z-index:5}
#header >*{pointer-events:auto}h1{margin:0;font-size:15px;letter-spacing:1.6px}small{font-size:11px;color:#bbd4ce}
.panel{background:#142b32e8;border:1px solid #76919580;box-shadow:0 6px 24px #0006;backdrop-filter:blur(12px);border-radius:14px;padding:11px}
#controls{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:6;max-width:700px;margin:auto}
.buttons{display:flex;gap:6px;flex-wrap:wrap}.buttons button{flex:1;min-width:72px}
button,a{border-radius:9px;border:1px solid #64858b;background:#223c43;color:#eff8f2;font:inherit;font-size:13px;padding:10px 8px;text-align:center;text-decoration:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #9beec4}button.active{background:#4e767a}
label{font-size:13px}#testreadout{font-size:12px;line-height:1.5;color:#d6ece4;margin-top:8px}
#options{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-top:9px}
#options label{display:flex;gap:5px;align-items:center}
input[type=checkbox]{accent-color:#88d1b0}select{background:#223c43;border:1px solid #64858b;color:#eff8f2;border-radius:8px;font-size:12px;padding:6px}
#help{font-size:11px;color:#a9c3c3;margin-top:5px}#debugreadout{font-size:11px;line-height:1.45;color:#91d6bd;margin-top:4px}
#error{display:none;position:fixed;top:84px;left:12px;right:12px;background:#692c32;border-radius:10px;padding:12px;z-index:10}
@media(min-width:750px){#controls{left:50%;transform:translateX(-50%);width:670px}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="header"><div><h1>HORIZON · RIVER LAB</h1><small>CONTROLLED GEOMETRY TEST · 1.2</small></div><a href="./index.html">Return to Horizon</a></div>
<div id="error" role="alert"></div>
<div id="controls" class="panel">
  <div class="buttons">
    <button id="bank" class="active">Walk bank</button>
    <button id="aerial">Flyover</button>
    <button id="top">Top-down</button>
    <button id="section">Cross-section</button>
  </div>
  <div id="options">
    <label><input type="checkbox" id="water" checked> Water</label><label><input type="checkbox" id="motion" checked> Flow animation</label><label><input type="checkbox" id="texture" checked> Water texture</label>
    <label><input type="checkbox" id="wire"> Wireframe</label>
    <label><input type="checkbox" id="grid"> Reference lines</label>
    <label><input type="checkbox" id="shores" checked> Banks</label><label>Terrain <select id="terrainMode"><option value="solid" selected>Solid / unlit</option><option value="colors">Colors / unlit</option><option value="shaded">Lit</option><option value="normals">Normals</option></select></label>
  </div>
  <div id="testreadout">Preparing test geometry…</div><div id="debugreadout" aria-live="polite"></div>
  <div id="help">Drag to orbit · Pinch to zoom · Two-finger drag to pan · Reset perspective with a view button. This test does not change Horizon's world.</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id),root=$('scene');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa5c9d4);scene.fog=new THREE.Fog(0xa5c9d4,320,850);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1500);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;controls.maxDistance=390;controls.minDistance=3;
scene.add(new THREE.HemisphereLight(0xddeefb,0x5f7150,2.1));
const sun=new THREE.DirectionalLight(0xfff5d4,2.0);sun.position.set(-80,140,-110);scene.add(sun);
const PLANE_MIN=-195,PLANE_MAX=195,TERRAIN_CELLS=180,RIVER_STEPS=180;
const RIVER_HALF_WIDTH=4.6,SHOULDER=48;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const centerX=z=>13*Math.sin(z/55)+5*Math.sin(z/27);
const centerY=z=>5.5-(z+180)*.009; // 5.5m upstream, 2.26m downstream
function baseHeight(x,z){
 return 12.5+Math.max(0,Math.abs(x)-65)*.023+1.3*Math.sin(z/62)*Math.sin(x/55);
}
// Both terrain and water share a single analytical channel definition.
// Water is 0.08m above its profile; the bed is 0.92m below it.
function channelAt(x,z){
 let nearest=null,dist=Infinity;
 const z0=Math.max(-180,Math.min(180,z));
 // Closest-point sampling along a continuous sinusoidal centerline.
 for(let q=-4;q<=4;q++){
  const zz=Math.max(-180,Math.min(180,z0+q*2));
  const xx=centerX(zz),d=Math.hypot(x-xx,z-zz);
  if(d<dist){dist=d;nearest=zz}
 }
 return {distance:dist,riverZ:nearest,water:centerY(nearest),width:RIVER_HALF_WIDTH};
}
function groundHeight(x,z){
 const c=channelAt(x,z);
 const d=c.distance;
 if(d>=SHOULDER)return baseHeight(x,z);
 // At center: flat channel bed. Bank gradually climbs to original terrain.
 const near=smooth((d-c.width)/(SHOULDER-c.width));
 const bed=c.water-.92;
 return bed+(baseHeight(x,z)-bed)*near;
}
function waterPosition(z,side){
 const x=centerX(z),slope=(centerX(Math.min(180,z+.1))-centerX(Math.max(-180,z-.1)))/.2;
 const scale=Math.sqrt(1+slope*slope),nx=1/scale,nz=-slope/scale;
 return [x+side*nx*RIVER_HALF_WIDTH,centerY(z)+.08,z+side*nz*RIVER_HALF_WIDTH];
}
function geometry(positions,indices){
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
 g.setIndex(indices);g.computeVertexNormals();g.computeBoundingSphere();return g;
}
function createTerrain(){
 const pos=[],idx=[],col=[];
 for(let j=0;j<=TERRAIN_CELLS;j++)for(let i=0;i<=TERRAIN_CELLS;i++){
  const x=PLANE_MIN+i*(PLANE_MAX-PLANE_MIN)/TERRAIN_CELLS;
  const z=PLANE_MIN+j*(PLANE_MAX-PLANE_MIN)/TERRAIN_CELLS;
  const h=groundHeight(x,z),d=channelAt(x,z).distance;
  pos.push(x,h,z);
  const riverbank=1-smooth((d-6)/30);
  const c=new THREE.Color(0x89a079).lerp(new THREE.Color(0x719778),riverbank*.65);
  col.push(c.r,c.g,c.b);
  if(i<TERRAIN_CELLS&&j<TERRAIN_CELLS){
   const a=j*(TERRAIN_CELLS+1)+i,b=a+1,d1=a+TERRAIN_CELLS+1;
   idx.push(a,d1,b,b,d1,d1+1);
  }
 }
 const g=geometry(pos,idx);
 // Fix: Lab 1.0/1.1 computed vertex colors but never installed the
 // color attribute. Lit and Colors/unlit materials therefore read zero RGB.
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x83a879,side:THREE.DoubleSide}));
 scene.add(m);return m;
}
// The river has a moving surface texture, not a physically simulated fluid.
// Procedural 128×256 repeating color variation, built once on the CPU; the
// texture offset changes on the GPU at render time (no per-frame mesh rebuild).
function waterSurfaceTexture(){
 const width=128,height=256,data=new Uint8Array(width*height*4);
 function fract(v){return v-Math.floor(v)}
 function hash2(x,y){return fract(Math.sin(x*127.1+y*311.7)*43758.5453)}
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  const u=x/width,v=y/height;
  const wave1=Math.sin(u*13+v*46+Math.sin(v*22)*1.2);
  const wave2=Math.sin(u*25-v*81+Math.sin(u*11)*1.4);
  const ripple=Math.sin((u*.85+v*1.8)*90+Math.sin(v*15)*3);
  const glint=Math.pow(Math.max(0,.5+.25*wave1+.20*wave2+.14*ripple),5);
  const fleck=hash2(x>>2,y>>2);
  const streak=(wave1*.45+wave2*.30+ripple*.25)*.5+.5;
  const foam=(glint*.7+Math.max(0,streak-.72)*.25+(fleck>.96?.13:0));
  const i=(y*width+x)*4;
  data[i]=Math.round(Math.min(255,128+foam*120+streak*16));
  data[i+1]=Math.round(Math.min(255,160+foam*80+streak*13));
  data[i+2]=Math.round(Math.min(255,170+foam*63+streak*12));
  data[i+3]=255;
 }
 const tex=new THREE.DataTexture(data,width,height,THREE.RGBAFormat);
 tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
 tex.magFilter=THREE.LinearFilter;tex.minFilter=THREE.LinearMipmapLinearFilter;
 tex.generateMipmaps=true;tex.colorSpace=THREE.SRGBColorSpace;
 tex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
 tex.needsUpdate=true;return tex;
}
const riverTexture=waterSurfaceTexture();
const plainWaterMaterial=new THREE.MeshPhongMaterial({
 color:0x318ba1,side:THREE.DoubleSide,shininess:65,specular:0x9fb9c3,depthWrite:true
});
const movingWaterMaterial=new THREE.MeshPhongMaterial({
 color:0x4699af,map:riverTexture,side:THREE.DoubleSide,shininess:78,specular:0xc7e2eb,depthWrite:true
});
function createWater(){
 const pos=[],idx=[],uvs=[];
 for(let i=0;i<=RIVER_STEPS;i++){
  const z=-180+i*360/RIVER_STEPS;
  pos.push(...waterPosition(z,-1),...waterPosition(z,1));
  // UVs run across the river in U and with world distance in V.
  // We animate V alone, preserving a directional downstream current.
  uvs.push(0,i*360/RIVER_STEPS/22,1,i*360/RIVER_STEPS/22);
  if(i){const k=i*2;idx.push(k-2,k,k-1,k-1,k,k+1)}
 }
 const g=geometry(pos,idx);
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
 const m=new THREE.Mesh(g,movingWaterMaterial);
 m.renderOrder=2;scene.add(m);return m;
}
const land=createTerrain(),water=createWater();
const terrainMaterials={
 solid:new THREE.MeshBasicMaterial({color:0x83a879,side:THREE.DoubleSide}),
 colors:new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}),
 shaded:new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}),
 normals:new THREE.MeshNormalMaterial({side:THREE.DoubleSide})
};
land.material.dispose();land.material=terrainMaterials.solid;
function updateTerrainMode(){land.material=terrainMaterials[$('terrainMode').value];land.material.wireframe=wireframe;}
$('terrainMode').onchange=updateTerrainMode;
const lines=new THREE.Group();
function lineStrip(points,color){
 const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));
 const o=new THREE.Line(g,new THREE.LineBasicMaterial({color,depthTest:true}));
 lines.add(o);
}
for(const side of [-1,1]){
 const list=[];
 for(let i=0;i<=RIVER_STEPS;i++){
  const z=-180+i*360/RIVER_STEPS,[x,,zz]=waterPosition(z,side);
  list.push([x,centerY(z)+.13,zz]);
 }
 lineStrip(list,0xfbe3a5);
}
const axis=new THREE.GridHelper(390,26,0xdddddd,0x90abaa);axis.position.y=.25;axis.visible=false;scene.add(axis);
lines.visible=true;scene.add(lines);
let wireframe=false;
let waterMotion=true,waterTextureEnabled=true;
function setWaterAppearance(){
 water.material=waterTextureEnabled?movingWaterMaterial:plainWaterMaterial;
 water.material.wireframe=wireframe;
}
$('motion').onchange=e=>{waterMotion=e.target.checked};
$('texture').onchange=e=>{waterTextureEnabled=e.target.checked;setWaterAppearance()};
function view(name){
 const views={
 bank:{pos:[42,10,-65],target:[centerX(-65),centerY(-65),-65]},
 aerial:{pos:[105,115,85],target:[0,5,0]},
 top:{pos:[.1,260,0],target:[0,0,0]},
 section:{pos:[75,16,-.1],target:[centerX(0),centerY(0),0]}
 };
 const v=views[name];camera.position.set(...v.pos);controls.target.set(...v.target);
 camera.up.set(0,1,0);controls.update();
 for(const id of Object.keys(views))$(id).classList.toggle('active',id===name);
}
for(const id of ['bank','aerial','top','section'])$(id).onclick=()=>view(id);
$('water').onchange=e=>water.visible=e.target.checked;
$('wire').onchange=e=>{wireframe=e.target.checked;for(const material of Object.values(terrainMaterials))material.wireframe=wireframe;plainWaterMaterial.wireframe=wireframe;movingWaterMaterial.wireframe=wireframe};
$('grid').onchange=e=>{axis.visible=e.target.checked};
$('shores').onchange=e=>{lines.visible=e.target.checked};
function audit(){
 let sample=0,minClear=Infinity,maxClear=-Infinity,rising=0,minDepth=Infinity,maxDepth=-Infinity;
 for(let i=0;i<=RIVER_STEPS;i++){
  const z=-180+i*360/RIVER_STEPS;
  if(i&&centerY(z)>centerY(z-360/RIVER_STEPS)+1e-7)rising++;
  for(const side of [-1,0,1]){
   const [x,y,zz]=waterPosition(z,side);
   const depth=y-groundHeight(x,zz);
   minDepth=Math.min(minDepth,depth);maxDepth=Math.max(maxDepth,depth);
   sample++;minClear=Math.min(minClear,Math.abs(y-centerY(z)-.08));
   maxClear=Math.max(maxClear,Math.abs(y-centerY(z)-.08));
  }
 }
 const triTerrain=land.geometry.index.count/3,triWater=water.geometry.index.count/3;
 $('testreadout').textContent=
 'Test river: 360 m long · 9.2 m wide · elevation 5.50 → 2.26 m · '+
 'continuous '+triWater+' water triangles · '+triTerrain+' terrain triangles. '+
 sample+' sampled positions: '+rising+' uphill steps; sampled water-to-ground separation '+
 minDepth.toFixed(2)+'–'+maxDepth.toFixed(2)+' m. Water and terrain use the same channel definition. The terrain is unlit by default; switch modes to isolate lighting and color issues.';
}
audit();
const color=land.geometry.getAttribute('color');
const uv=water.geometry.getAttribute('uv');
$('debugreadout').textContent='GPU geometry checks: terrain color attribute '+(color?color.count:'MISSING')+' vertices; water UVs '+(uv?uv.count:'MISSING')+' vertices; animated texture 128×256, precomputed once. Flow speed ≈ 0.7 m/s (visual approximation).';
view('bank');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
window.addEventListener('resize',resize);
const animationClock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,animationClock.getDelta());
 if(waterMotion&&waterTextureEnabled)riverTexture.offset.y=(riverTexture.offset.y-dt*.032)%1;
 controls.update();renderer.render(scene,camera);
});
}catch(err){$('error').style.display='block';$('error').textContent='River lab error: '+String(err);throw err}
</script></body></html>
