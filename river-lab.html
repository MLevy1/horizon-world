<script type="module">
import * as THREE from 'three';

try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa5c9d4);scene.fog=new THREE.Fog(0xa5c9d4,320,850);

const PLANE_MIN=-195,PLANE_MAX=265,TERRAIN_CELLS=184,RIVER_STEPS=216;

const pondScene=()=>geom.scene==='pond';

const pondCenter=z=>centerX(POND_INLET)+7*Math.sin((z-POND_INLET)/147);

// A river mouth enters a broadening bay; lateral shelves and unequal lobes
// replace the former symmetrical sine lens and its elongated pointed tail.
const POND_SHORE_STATIONS=[
 [500,5.5,5.5],[515,10,14],[540,28,31],[575,55,43],
 [615,84,66],[650,110,80],[690,102,106],[725,80,99],
 [760,54,80],[795,43,53],[823,31,34],[841,17,18],
 [847,9,10],[850,0,0]
];
function pondSides(z){
 if(z<POND_INLET||z>POND_TAIL)return {left:0,right:0};

 while(i<POND_SHORE_STATIONS.length-2&&z>POND_SHORE_STATIONS[i+1][0])i++;

         right:Math.max(0,mix(r1*scale,geom.width/2,inlet))};
}
function pondBounds(z){

 return {left:cx-left,right:cx+right,center:cx,width:left+right};
}
function pondRadius(z){

}
function pondGround(x,z,raw){

  const depth=.30+geom.pondDepth*Math.pow(Math.sin(Math.PI*u*.5),1.5);
  return Math.min(raw,pondLevel()-depth);

 if(outside<toe)return Math.min(raw,mix(pondLevel()-.24,pondLevel()+.42,smooth(outside/toe)));
 if(outside<toe+blend){
  const target=mix(pondLevel()+.42,raw,smooth((outside-toe)/blend));
  return Math.min(raw,target);
 }

}

const growthScene=()=>geom.scene==='growth';
const sceneEnd=()=>pondScene()?POND_INLET:growthScene()?GROWTH_END:(hasOutlet()?POND_END:RIVER_END);
const RIVER_START=-180,RIVER_END=180,POND_END=250;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};

const longHead=()=>geom.scene==='long'&&hasHead();
const headStart=()=>longHead()?RIVER_START-geom.headLength:RIVER_START;
const terrainStart=()=>headStart()-25;
const terrainEnd=()=>pondScene()?POND_TAIL+25:sceneEnd()+25;

const growth=z=>Math.pow(development(z),geom.headPower);
const stagedWater=()=>longHead()&&geom.source==='runoff';
const STAGED={startWidth:.60,fullWidth:1.60,textureWidth:1.00,minRun:48};
const hydroWidth=z=>geom.width*growth(z);
const thresholdZ=width=>headStart()+geom.headLength*Math.pow(Math.min(1,Math.max(0,width/geom.width)),1/geom.headPower);
const waterStartZ=()=>stagedWater()?thresholdZ(STAGED.startWidth):headStart();

const waterTextured=z=>!stagedWater()||hydroWidth(z)>=STAGED.textureWidth;
const bankGrowth=z=>longHead()&&geom.source==='runoff'?Math.pow(development(z),2):1;
const isSmall=()=>geom.width<=4.5;
const streamNoise=z=>.13*Math.sin(z*.17+.8)+.06*Math.sin(z*.49+1.7)+.045*Math.sin(z*.87+.2);
const streamWobble=z=>1.05*Math.sin(z/10.5)+.42*Math.sin(z/5.7)+.22*Math.sin(z/3.1);
const hasHead=()=>geom.mode==='head'||geom.mode==='both';
const hasOutlet=()=>geom.mode==='outlet'||geom.mode==='both';
const riverX=z=>13*Math.sin(z/55)+5*Math.sin(z/27)+(isSmall()?streamWobble(z):0);
const centerX=z=>growthScene()?13*Math.sin(z/150)+8*Math.sin(z/66)+1.3*Math.sin(z/19):pondScene()?13*Math.sin(z/150)+8*Math.sin(z/66):z>180?riverX(180)+.06*(z-180):riverX(z);
const centerY=z=>{
 if(pondScene()){
  if(z>=POND_INLET)return pondLevel();
  if(z>=POND_INLET-120){
   // Hermite grade: natural upstream slope, horizontal at the pond level.
   const t=(z-(POND_INLET-120))/120;
   const start=5.5-((POND_INLET-120)+180)*.009;
   const h00=2*t*t*t-3*t*t+1,h10=t*t*t-2*t*t+t,h01=-2*t*t*t+3*t*t;
   return h00*start+h10*(-.009*120)+h01*pondLevel();
  }
 }
 const base=5.5-(((growthScene()||pondScene())?z:Math.min(z,180))+180)*.009;
 if(longHead()||!isSmall()||!hasHead()||geom.source!=='spring'||z>=-145)return base;
 // A small nearly level spring pool, gradually joining the normal grade.

};
function growthWidth(z){
 // Simplified proxy for drainage accumulation. Width increases *after*
 // each tributary junction over a 160 m reach; it does not restart from zero.
 const start=Math.min(2.8,geom.width),gains=[2.2,3.7,7.3];
 let added=0;
 for(let i=0;i<GROWTH_JUNCTIONS.length;i++)
  added+=gains[i]*smooth((z-(GROWTH_JUNCTIONS[i]-80))/160);

}
function channelWidth(z){
 if(pondScene())return geom.width/2;
 if(growthScene())return growthWidth(z)/2;
 const normal=geom.width/2;
 if(longHead()&&geom.source==='runoff')return Math.max(.006,normal*growth(z)*(isSmall()?1+streamNoise(z):1));

  const t=Math.max(0,Math.min(1,(z-180)/(POND_END-180)));
  const mouth=Math.max(21,geom.width*2.4),maxWidth=Math.max(30,geom.width*3.6);

    maxWidth*(1-smooth((t-.28)/.72)));

  return mix(normal,Math.max(21,geom.width*2.4),smooth((z-(RIVER_END-geom.outletLength))/geom.outletLength));
 }

  const variance=1+streamNoise(z);
  if(hasHead()){
   const t=Math.max(0,Math.min(1,(z-headStart())/geom.headLength));
   if(geom.source==='spring'){
    // Zero-width cap -> bulb of spring water -> constricted throat -> creek.
    const pool=Math.exp(-Math.pow((z-(RIVER_START+12))/7,2));
    const shaft=Math.max(.008,smooth(t));
    return Math.max(.015,normal*(shaft*variance+1.18*pool));
   }
   if(geom.source==='seep'){
    // A broad swale gathers moisture without a conspicuous pond.
    return Math.max(.008,normal*smooth(t)*variance);
   }
   return normal*mix(.055,1,smooth(t))*variance;
  }

function channelDepth(z){
 if(pondScene())return geom.depth;
 if(growthScene())return .34+.075*(growthWidth(z)-2.8);
 if(longHead()&&geom.source==='runoff')return geom.depth*Math.pow(development(z),1.65);

  head=Math.max(.045,Math.min(1,Math.max(head,Math.exp(-Math.pow((z-(RIVER_START+12))/10,2))*.8)));

}
function bankRise(z){
 if(pondScene())return geom.rise;
 if(growthScene())return .45+.035*(growthWidth(z)-2.8);

  head=Math.max(.06,Math.min(1,Math.max(head,Math.exp(-Math.pow((z-(RIVER_START+12))/10,2))*.45)));

function baseHeight(x,z){
 // A gently rolling floodplain, with banks cut DOWN rather than built up.
 // Terrain follows the broad valley's longitudinal grade.

function channelAt(x,z){

function waterPosition(z,side){

  return [mix(x+side*nx*width,x+side*width,t),centerY(z)+mix(.025,.105,t),mix(z+side*nz*width,z,t)];

function waterSampleCount(){

}

function createTerrain(){
 const extended=geom.scene!=='short',close=isSmall()||extended;
 const columns=extended?(pondScene()?214:growthScene()?184:124):(close?176:TERRAIN_CELLS);
 const rows=extended?Math.min(1250,Math.ceil((terrainEnd()-terrainStart())/(pondScene()?2:growthScene()?1.8:2.25))):(close?440:TERRAIN_CELLS);
 const pos=[],idx=[],col=[],stride=columns+1;
 for(let j=0;j<=rows;j++){
  const z=extended?mix(terrainStart(),terrainEnd(),j/rows):mix(PLANE_MIN,PLANE_MAX,j/rows);
  for(let i=0;i<=columns;i++){
   let x;
   if(close){
    // Terrain vertices concentrate beside the small watercourse.
    // ~0.3m transverse sampling near banks, while far terrain stays coarse.
    const u=i/columns*2-1,abs=Math.abs(u),corridor=pondScene()?Math.max(18,pondRadius(z)+geom.pondShore+10):growthScene()?Math.max(17,channelWidth(z)+18):extended?14:26,split=extended?.58:.48;
    const offset=abs<=split?corridor*abs/split:
      corridor+((pondScene()?235:extended?170:PLANE_MAX-35)-corridor)*((abs-split)/(1-split));
    x=(pondScene()&&z>=POND_INLET?pondCenter(z):centerX(z))+Math.sign(u)*offset;
   }else x=mix(PLANE_MIN,PLANE_MAX,i/columns);
   const c=channelAt(x,z),h=groundHeight(x,z,c);
   pos.push(x,h,z);
   const p=pondScene()?pondBounds(z):null;
   const dist=p&&z>=POND_INLET?(x<p.left?p.left-x:x>p.right?x-p.right:-Math.min(x-p.left,p.right-x)):c.distance-c.width*.6;
   const shade=1-smooth(dist/Math.max(1,geom.bankWidth+geom.shoulder));
   const color=new THREE.Color(0x89a079).lerp(new THREE.Color(0x719778),shade*.65);
   if(pondScene()){
    let shore=Infinity;
    if(z>=POND_INLET&&z<=POND_TAIL){
     const p=pondBounds(z);
     shore=x<p.left?p.left-x:x>p.right?x-p.right:-Math.min(x-p.left,p.right-x);
     // Do not tint an entire terrain row after the pond's end.
    }else if(z>POND_INLET-80&&z<POND_INLET){shore=c.distance-c.width}
    const wet=1-smooth((shore+1.3)/4.3);
    const dry=(1-smooth((shore-1)/Math.max(2,geom.pondShore+3)))*smooth((shore+2)/3);
    const irregular=Math.sin(x*.23+z*.17)*Math.sin(z*.37-x*.16);
    const grain=.045*Math.sin(x*1.7+z*.9)*Math.sin(z*1.9-x*1.1);
    const tan=new THREE.Color(0xb4a98b).lerp(new THREE.Color(0x978e78),Math.max(0,Math.min(1,.34+irregular*.25+grain)));
    color.lerp(tan,Math.max(0,Math.min(.92,dry*.82)));
    color.lerp(new THREE.Color(0x777d72),Math.max(0,Math.min(.80,wet*.61)));
   }
   col.push(color.r,color.g,color.b);
   if(i<columns&&j<rows){
    const a=j*stride+i,b=a+1,d=a+stride;
    idx.push(a,d,b,b,d,d+1);
   }
  }
 }
 const g=geometry(pos,idx);
 g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
 const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x83a879,side:THREE.DoubleSide}));
 scene.add(m);return m;
}
// The river has a moving surface texture, not a physically simulated fluid.
// Procedural 128×256 repeating color variation, built once on the CPU; the
// texture offset changes on the GPU at render time (no per-frame mesh rebuild).
function waterSurfaceTexture(){
 const width=128,height=256,data=new Uint8Array(width*height*4);
 function fract(v){return v-Math.floor(v)}
 function hash2(x,y){return fract(Math.sin(x*127.1+y*311.7)*43758.5453)}
 for(let y=0;y<height;y++)for(let x=0;x<width;x++){
  const u=x/width,v=y/height;
  const wave1=Math.sin(u*13+v*46+Math.sin(v*22)*1.2);
  const wave2=Math.sin(u*25-v*81+Math.sin(u*11)*1.4);
  const ripple=Math.sin((u*.85+v*1.8)*90+Math.sin(v*15)*3);
  const glint=Math.pow(Math.max(0,.5+.25*wave1+.20*wave2+.14*ripple),5);
  const fleck=hash2(x>>2,y>>2);
  const streak=(wave1*.45+wave2*.30+ripple*.25)*.5+.5;
  const foam=(glint*.7+Math.max(0,streak-.72)*.25+(fleck>.96?.13:0));
  const i=(y*width+x)*4;
  data[i]=Math.round(Math.min(255,128+foam*120+streak*16));
  data[i+1]=Math.round(Math.min(255,160+foam*80+streak*13));
  data[i+2]=Math.round(Math.min(255,170+foam*63+streak*12));
  data[i+3]=255;
 }
 const tex=new THREE.DataTexture(data,width,height,THREE.RGBAFormat);
 tex.wrapS=THREE.RepeatWrapping;tex.wrapT=THREE.RepeatWrapping;
 tex.magFilter=THREE.LinearFilter;tex.minFilter=THREE.LinearMipmapLinearFilter;
 tex.generateMipmaps=true;tex.colorSpace=THREE.SRGBColorSpace;
 tex.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
 tex.needsUpdate=true;return tex;
}
const riverTexture=waterSurfaceTexture();
const plainWaterMaterial=new THREE.MeshPhongMaterial({
 color:0x318ba1,vertexColors:true,transparent:true,side:THREE.DoubleSide,shininess:65,specular:0x9fb9c3,depthWrite:false
});
const movingWaterMaterial=new THREE.MeshPhongMaterial({
 color:0x4699af,map:riverTexture,vertexColors:true,transparent:true,side:THREE.DoubleSide,shininess:78,specular:0xc7e2eb,depthWrite:false
});
function createWater(){
 const pos=[],idx=[],uvs=[],colors=[],grouper=[];
 const begin=waterStartZ(),end=sceneEnd();
 const span=end-begin,active=!stagedWater()||span>=STAGED.minRun;
 const count=active?Math.ceil(span/(geom.scene==='long'?1.25:1)):0;
 let oldMat=-1,groupBegin=0;
 for(let i=0;i<=count&&active;i++){
  const z=mix(begin,end,i/Math.max(1,count));
  pos.push(...waterPosition(z,-1),...waterPosition(z,1));
  uvs.push(0,(z-headStart())/22,1,(z-headStart())/22);
  const alpha=waterOpacity(z);
  colors.push(1,1,1,alpha,1,1,1,alpha);
  if(i>0){
   const k=i*2,indexBegin=idx.length;
   idx.push(k-2,k,k-1,k-1,k,k+1);
   const mid=mix(begin,end,(i-.5)/count),material=waterTextured(mid)?1:0;
   if(oldMat!==material){
    if(oldMat!==-1)grouper.push([groupBegin,indexBegin-groupBegin,oldMat]);
    groupBegin=indexBegin;oldMat=material;
   }
  }
 }
 if(oldMat!==-1)grouper.push([groupBegin,idx.length-groupBegin,oldMat]);
 const g=geometry(pos,idx);
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
 g.setAttribute('color',new THREE.Float32BufferAttribute(colors,4));
 for(const [start,count,material] of grouper)g.addGroup(start,count,material);
 const mesh=new THREE.Mesh(g,[plainWaterMaterial,movingWaterMaterial]);
 mesh.renderOrder=2;scene.add(mesh);return mesh;
}
// Separate standing-water mesh: a level basin surface with its own shoreline.
// The river stops at the pond inlet. The basin banks blend over 20m.
// Use the river's exact material and texture phase at the mouth.
// The lake's 24 transverse subdivisions prevent texture stretching.
const pondWaterMaterial=movingWaterMaterial;
function createPondWater(){
 if(!pondScene())return null;
 const pos=[],uv=[],rgba=[],idx=[],steps=350,across=24;
 for(let i=0;i<=steps;i++){
  const z=mix(POND_INLET,POND_TAIL,i/steps),p=pondBounds(z);
  const margin=Math.min(.55,p.width*.10),left=p.left+margin,right=p.right-margin;
  for(let j=0;j<=across;j++){
   const x=mix(left,right,j/across);
   pos.push(x,pondLevel()+.105,z);
   // Width is 11 m at the inlet; both end vertices match river U=0,1.
   uv.push((x-left)/Math.max(1,geom.width),(z-headStart())/22);
   rgba.push(1,1,1,1);
   if(i>0&&j>0){
    const k=i*(across+1)+j,prev=k-(across+1);
    idx.push(prev-1,prev,k-1,k-1,prev,k);
   }
  }
 }
 const g=geometry(pos,idx);
 g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
 g.setAttribute('color',new THREE.Float32BufferAttribute(rgba,4));
 const mesh=new THREE.Mesh(g,pondWaterMaterial);
 mesh.renderOrder=2;scene.add(mesh);return mesh;
}
let land=createTerrain(),water=createWater(),pondWater=createPondWater();
const pondGroundMaterial=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
const terrainMaterials={
 solid:new THREE.MeshBasicMaterial({color:0x83a879,side:THREE.DoubleSide}),
 colors:new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}),
 shaded:new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide}),
 normals:new THREE.MeshNormalMaterial({side:THREE.DoubleSide})
};
land.material.dispose();land.material=pondGroundMaterial;
function selectedTerrainMaterial(){const mode=$('terrainMode').value;return pondScene()&&mode==='solid'?pondGroundMaterial:terrainMaterials[mode]}
function updateTerrainMode(){land.material=selectedTerrainMaterial();land.material.wireframe=wireframe;}
$('terrainMode').onchange=updateTerrainMode;
const lines=new THREE.Group();
function lineStrip(points,color){
 const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));
 const o=new THREE.Line(g,new THREE.LineBasicMaterial({color,depthTest:true}));
 lines.add(o);
}
for(const side of [-1,1]){
 const list=[];
 for(let i=0;i<=waterSampleCount();i++){
  const z=longitudinalSample(i),[x,,zz]=waterPosition(z,side);
  list.push([x,centerY(z)+.075,zz]);
 }
 lineStrip(list,0xfbe3a5);
}
const axis=new THREE.GridHelper(450,30,0xdddddd,0x90abaa);axis.position.y=.25;axis.visible=false;scene.add(axis);
lines.visible=true;scene.add(lines);
let wireframe=false;
let waterMotion=true,waterTextureEnabled=true;
function setWaterAppearance(){
 water.material=waterTextureEnabled?[plainWaterMaterial,movingWaterMaterial]:[plainWaterMaterial,plainWaterMaterial];
 if(pondWater)pondWater.material=waterTextureEnabled?movingWaterMaterial:plainWaterMaterial;
 plainWaterMaterial.wireframe=wireframe;movingWaterMaterial.wireframe=wireframe;
}
$('motion').onchange=e=>{waterMotion=e.target.checked};
$('texture').onchange=e=>{waterTextureEnabled=e.target.checked;setWaterAppearance()};
function view(name){
 const views={
 bank:pondScene()?{pos:[centerX(430)+30,centerY(430)+5,425],target:[centerX(430),centerY(430),445]}:growthScene()?{pos:[centerX(500)+28,centerY(500)+5,495],target:[centerX(500),centerY(500),500]}:{pos:[29,centerY(-65)+3,-65],target:[centerX(-65),centerY(-65),-65]},
 aerial:pondScene()?{pos:[220,250,630],target:[pondCenter(630),pondLevel(),630]}:growthScene()?{pos:[230,330,540],target:[centerX(540),centerY(540),540]}:geom.scene==='long'?{pos:[160,600,headStart()+geom.headLength*.5],target:[0,centerY(headStart()+geom.headLength*.5),headStart()+geom.headLength*.5]}:{pos:[100,80,95],target:[centerX(20),centerY(20),20]},
 top:pondScene()?{pos:[.1,800,600],target:[pondCenter(600),pondLevel(),600]}:growthScene()?{pos:[.1,1300,500],target:[centerX(500),centerY(500),500]}:geom.scene==='long'?{pos:[.1,Math.max(750,geom.headLength*1.25),headStart()+geom.headLength*.5],target:[0,centerY(headStart()+geom.headLength*.5),headStart()+geom.headLength*.5]}:{pos:[.1,260,0],target:[0,0,0]},
 section:pondScene()?{pos:[pondCenter(630)+150,pondLevel()+26,630],target:[pondCenter(630),pondLevel(),630]}:growthScene()?{pos:[centerX(450)+35,centerY(450)+6,450],target:[centerX(450),centerY(450),450]}:{pos:[38,centerY(0)+5,0],target:[centerX(0),centerY(0),0]},
 headwater:{pos:[centerX(headStart()+geom.headLength*.67)+28,centerY(headStart()+geom.headLength*.67)+20,headStart()+geom.headLength*.67-32],
 target:[centerX(headStart()+geom.headLength*.67),centerY(headStart()+geom.headLength*.67),headStart()+geom.headLength*.67]}
 };
 const v=views[name];camera.position.set(...v.pos);controls.target.set(...v.target);
 camera.up.set(0,1,0);controls.update();
 for(const id of ['bank','aerial','top','section'])$(id).classList.toggle('active',id===name);
 $('headwaterView').classList.toggle('active',name==='headwater');
}
for(const id of ['bank','aerial','top','section'])$(id).onclick=()=>{view(id);setControlsOpen(false)};
$('headwaterView').onclick=()=>{view('headwater');setControlsOpen(false)};
$('water').onchange=e=>{water.visible=e.target.checked;if(pondWater)pondWater.visible=e.target.checked};
$('wire').onchange=e=>{wireframe=e.target.checked;for(const material of [...Object.values(terrainMaterials),pondGroundMaterial])material.wireframe=wireframe;plainWaterMaterial.wireframe=wireframe;movingWaterMaterial.wireframe=wireframe};
$('grid').onchange=e=>{axis.visible=e.target.checked};
$('shores').onchange=e=>{lines.visible=e.target.checked};
const PRESETS={
 stream:{width:2.8,depth:.3,rise:.45,bankWidth:1.1,shoulder:4,headLength:28,outletLength:30},
 river:{width:9.2,depth:.9,rise:1,bankWidth:2.8,shoulder:11,headLength:45,outletLength:65},
 incised:{width:7.5,depth:1.4,rise:1.8,bankWidth:2,shoulder:7,headLength:45,outletLength:55},
 lowland:{width:16,depth:1.2,rise:.5,bankWidth:5.5,shoulder:22,headLength:80,outletLength:90}
};
const PARAMS=['width','depth','rise','bankWidth','shoulder','headLength','headPower','outletLength'];
function drawCrossSection(){
 const canvas=$('profileCanvas'),ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height;
 ctx.clearRect(0,0,W,H);
 const z=0,c=channelAt(centerX(z),z);
 const span=c.width+geom.bankWidth+geom.shoulder+5,scale=W/(span*2);
 const raw=baseHeight(centerX(z),z);
 const low=c.water-geom.depth-1,high=Math.max(raw,c.water+geom.rise)+1.1;
 const py=y=>H-12-(y-low)/(high-low)*(H-23),px=d=>W/2+d*scale;
 ctx.strokeStyle='#456b70';ctx.lineWidth=1;ctx.setLineDash([4,4]);
 ctx.beginPath();ctx.moveTo(0,py(c.water));ctx.lineTo(W,py(c.water));ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#648d72';ctx.beginPath();ctx.moveTo(0,H);
 for(let i=0;i<=160;i++){
  const d=mix(-span,span,i/160);
  const h=profileHeight(Math.abs(d),c,raw);
  ctx.lineTo(px(d),py(Math.min(raw,h)));
 }
 ctx.lineTo(W,H);ctx.closePath();ctx.fill();
 ctx.fillStyle='#328ea4';ctx.fillRect(px(-c.width),py(c.water),c.width*2,2.5);
 ctx.font='12px system-ui';ctx.fillStyle='#eff8ef';
 ctx.fillText('Bank / underwater bed / bank',10,17);
 ctx.fillText('Waterline',W-85,py(c.water)-7);
}
function rebuildGeometry(){
 if(land){scene.remove(land);land.geometry.dispose()}
 if(water){scene.remove(water);water.geometry.dispose()}
 if(pondWater){scene.remove(pondWater);pondWater.geometry.dispose()}
 land=createTerrain();water=createWater();pondWater=createPondWater();
 land.material.dispose();land.material=selectedTerrainMaterial();
 land.material.wireframe=wireframe;water.visible=$('water').checked;
 if(pondWater)pondWater.visible=$('water').checked;
 setWaterAppearance();
 for(const child of lines.children){child.geometry.dispose();child.material.dispose()}
 lines.clear();
 for(const side of [-1,1]){
  const points=[];
  for(let i=0;i<=waterSampleCount();i++){
   const z=longitudinalSample(i),[x,,zz]=waterPosition(z,side);
   points.push([x,centerY(z)+.075,zz]);
  }
  lineStrip(points,0xfbe3a5);
 }
 lines.visible=$('shores').checked;
 drawCrossSection();audit();
}
const POND_PARAMS=['pondRadius','pondLevelOffset','pondShore','pondDepth'];
function syncUI(){
 $('pondControls').style.display=pondScene()?'grid':'none';
 for(const key of POND_PARAMS){
  $(key).value=geom[key];
  $(key+'Value').textContent=Number(geom[key]).toFixed(key==='pondLevelOffset'||key==='pondDepth'?2:0)+' m';
 }
 $('sceneMode').value=geom.scene;
 $('headLength').min=geom.scene==='long'?250:15;
 $('headLength').max=geom.scene==='long'?2000:90;
 $('headLength').step=geom.scene==='long'?50:5;
 $('headPower').disabled=geom.scene!=='long';
 $('headSource').querySelector('option[value="runoff"]').disabled=geom.scene!=='long';
 for(const key of PARAMS){
  $(key).value=geom[key];
  $(key+'Value').textContent=Number(geom[key]).toFixed(key==='headPower'?2:key==='width'||key==='depth'||key==='rise'||key==='bankWidth'||key==='shoulder'?1:0)+(key==='headPower'?' ×':' m');
 }
 $('endMode').value=geom.mode;
 $('headSource').value=geom.source;
 $('headSource').disabled=!hasHead()||growthScene()||pondScene();
 $('endMode').disabled=growthScene()||pondScene();
 $('headLength').disabled=growthScene()||pondScene();
 $('headPower').disabled=geom.scene!=='long';
}
$('sceneMode').onchange=e=>{
 geom.scene=e.target.value;
 if(geom.scene==='pond'){
  Object.assign(geom,PRESETS.river);
  geom.width=11;geom.depth=1.1;geom.rise=.8;geom.bankWidth=3;geom.shoulder=11;
  geom.mode='blunt';geom.source='taper';$('preset').value='river';
 }else if(geom.scene==='growth'){
  Object.assign(geom,PRESETS.river);
  geom.width=16;geom.depth=1.2;geom.rise=.85;geom.bankWidth=3.2;geom.shoulder=9;
  geom.mode='blunt';geom.source='taper';$('preset').value='river';
 }else if(geom.scene==='long'){
  Object.assign(geom,PRESETS.stream);
  geom.headLength=1000;geom.headPower=2.5;geom.source='runoff';geom.mode='head';
  $('preset').value='stream';
 }else{
  Object.assign(geom,PRESETS.river);
  geom.headLength=45;geom.source='taper';geom.mode='both';
  $('preset').value='river';
 }
 scene.fog.far=geom.scene==='short'?850:6000;
 syncUI();rebuildGeometry();view('top');
};
$('preset').onchange=e=>{
 const wasLong=geom.scene==='long',wasGrowth=growthScene(),wasPond=pondScene();
 Object.assign(geom,PRESETS[e.target.value]);
 geom.source=wasLong?'runoff':(wasGrowth||wasPond)?'taper':(e.target.value==='stream'?'spring':'taper');
 if(wasGrowth||wasPond)geom.mode='blunt';
 if(wasLong)geom.headLength=1000;
 syncUI();rebuildGeometry();
};
$('endMode').onchange=e=>{geom.mode=e.target.value;syncUI();rebuildGeometry()};
$('headSource').onchange=e=>{geom.source=e.target.value;rebuildGeometry()};
for(const key of POND_PARAMS)$(key).onchange=e=>{geom[key]=Number(e.target.value);syncUI();rebuildGeometry()};
for(const key of PARAMS)$(key).onchange=e=>{
 geom[key]=Number(e.target.value);syncUI();rebuildGeometry();
 if(key==='headLength'&&geom.scene==='long')view('top');
};
function audit(){
 let count=0,minDepth=Infinity,maxDepth=-Infinity,uphill=0;
 const end=sceneEnd();
 for(let i=0;i<=waterSampleCount();i++){
  const z=longitudinalSample(i);
  if(i&&centerY(z)>centerY(longitudinalSample(i-1))+.00001)uphill++;
  for(const side of [-1,0,1]){
   const [x,y,zz]=waterPosition(z,side);
   const diff=y-groundHeight(x,zz);
   if(!Number.isFinite(diff))throw Error('Non-finite ground elevation');
   count++;minDepth=Math.min(minDepth,diff);maxDepth=Math.max(maxDepth,diff);
  }
 }
 $('testreadout').textContent='Controlled river geometry · '+geom.width.toFixed(1)+' m main-channel width · '+
 (end-headStart()).toFixed(0)+' m extent · '+geom.depth.toFixed(1)+' m depth · '+geom.rise.toFixed(1)+
 ' m bank rise · '+water.geometry.index.count/3+' water triangles · '+land.geometry.index.count/3+
 ' land triangles · '+uphill+' uphill steps. Sampled water clearance '+minDepth.toFixed(2)+
 '–'+maxDepth.toFixed(2)+' m. '+(hasHead()?(longHead()&&geom.source==='runoff'?'Headwater develops over '+geom.headLength.toFixed(0)+' m (width exponent '+geom.headPower.toFixed(2)+'). ':isSmall()?'Source: '+geom.source+'. ':'Headwater taper. '):'')+
 (hasOutlet()?'Outlet widens into an enclosed test pond.':'Blunt downstream test boundary.')+
 (longHead()&&geom.source==='runoff'?
 ' Width at 25/50/75% downstream: '+[.25,.5,.75].map(t=>(geom.width*Math.pow(t,geom.headPower)).toFixed(2)).join(' / ')+' m. ':'')+
 (stagedWater()?' Water begins '+(waterStartZ()-headStart()).toFixed(0)+' m downstream; first texture '+(thresholdZ(STAGED.textureWidth)-headStart()).toFixed(0)+' m; full opacity '+(thresholdZ(STAGED.fullWidth)-headStart()).toFixed(0)+' m.':'')+
 (pondScene()?' River-to-pond prototype: textured water matching inlet material and UV phase; no straight end-of-pond shore tint; independent asymmetric basin at '+pondLevel().toFixed(2)+' m. ':'')+
 (growthScene()?' Stream-to-river prototype: tributary confluences at 100, 450, 850 m; continuous channel width '+GROWTH_JUNCTIONS.map(z=>growthWidth(z).toFixed(1)).join(' / ')+' m at junctions. ':'')+
 ' No fluid simulation.';
 const color=land.geometry.getAttribute('color'),uv=water.geometry.getAttribute('uv');
 $('debugreadout').textContent='Vertex colors: '+(color?color.count:'missing')+
 ' · water UVs: '+(uv?uv.count:'missing')+' · animated surface: single reusable 128×256 texture.';
}
scene.fog.far=6000;
syncUI();drawCrossSection();audit();view('aerial');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
window.addEventListener('resize',resize);
const animationClock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,animationClock.getDelta());
 if(waterMotion&&waterTextureEnabled)riverTexture.offset.y=(riverTexture.offset.y-dt*.032)%1;
 controls.update();renderer.render(scene,camera);
});
}catch(err){$('error').style.display='block';$('error').textContent='River lab error: '+String(err);throw err}
