<script type="module">

import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const PLANE_MIN=-195,PLANE_MAX=265,TERRAIN_CELLS=184,RIVER_STEPS=216;

const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};

const isSmall=()=>geom.width<=4.5;
const streamNoise=z=>.13*Math.sin(z*.17+.8)+.06*Math.sin(z*.49+1.7)+.045*Math.sin(z*.87+.2);

 // A small nearly level spring pool, gradually joining the normal grade.

};
function channelWidth(z){
 const normal=geom.width/2;

  const t=Math.max(0,Math.min(1,(z-180)/(POND_END-180)));

  return mix(normal,Math.max(21,geom.width*2.4),smooth((z-(RIVER_END-geom.outletLength))/geom.outletLength));

  const variance=1+streamNoise(z);

   if(geom.source==='spring'){

    const pool=Math.exp(-Math.pow((z-(RIVER_START+12))/7,2));
    const shaft=Math.max(.008,smooth(t));

   }

    return Math.max(.008,normal*smooth(t)*variance);

function channelDepth(z){

function bankRise(z){

function baseHeight(x,z){

 // Terrain follows the broad valley's longitudinal grade.

  const z=mix(PLANE_MIN,PLANE_MAX,j/rows);
  for(let i=0;i<=columns;i++){
   let x;
   if(close){
    // Terrain vertices concentrate beside the small watercourse.
    // ~0.3m transverse sampling near banks, while far terrain stays coarse.
    const u=i/columns*2-1,abs=Math.abs(u),corridor=26,split=.48;

   }else x=mix(PLANE_MIN,PLANE_MAX,i/columns);

   pos.push(x,h,z);
   const shade=1-smooth((c.distance-c.width*.6)/Math.max(1,geom.bankWidth+geom.shoulder));
   const color=new THREE.Color(0x89a079).lerp(new THREE.Color(0x719778),shade*.65);
   col.push(color.r,color.g,color.b);
   if(i<columns&&j<rows){
    const a=j*stride+i,b=a+1,d=a+stride;
    idx.push(a,d,b,b,d,d+1);
   }

// The river has a moving surface texture, not a physically simulated fluid.
// Procedural 128×256 repeating color variation, built once on the CPU; the
// texture offset changes on the GPU at render time (no per-frame mesh rebuild).
function waterSurfaceTexture(){
 const width=128,height=256,data=new Uint8Array(width*height*4);

 function hash2(x,y){return fract(Math.sin(x*127.1+y*311.7)*43758.5453)}

  const u=x/width,v=y/height;
  const wave1=Math.sin(u*13+v*46+Math.sin(v*22)*1.2);
  const wave2=Math.sin(u*25-v*81+Math.sin(u*11)*1.4);

  const foam=(glint*.7+Math.max(0,streak-.72)*.25+(fleck>.96?.13:0));
  const i=(y*width+x)*4;
  data[i]=Math.round(Math.min(255,128+foam*120+streak*16));
  data[i+1]=Math.round(Math.min(255,160+foam*80+streak*13));
  data[i+2]=Math.round(Math.min(255,170+foam*63+streak*12));

const riverTexture=waterSurfaceTexture();
const plainWaterMaterial=new THREE.MeshPhongMaterial({

});
const movingWaterMaterial=new THREE.MeshPhongMaterial({

function createWater(){

  const z=longitudinalSample(i);

  // We animate V alone, preserving a directional downstream current.
  uvs.push(0,(z-RIVER_START)/22,1,(z-RIVER_START)/22);

$('terrainMode').onchange=updateTerrainMode;
const lines=new THREE.Group();
function lineStrip(points,color){
 const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));

for(const side of [-1,1]){

  list.push([x,centerY(z)+.075,zz]);

}
const axis=new THREE.GridHelper(450,30,0xdddddd,0x90abaa);axis.position.y=.25;axis.visible=false;scene.add(axis);

let wireframe=false;

$('motion').onchange=e=>{waterMotion=e.target.checked};

function view(name){

for(const id of ['bank','aerial','top','section'])$(id).onclick=()=>view(id);

$('wire').onchange=e=>{wireframe=e.target.checked;for(const material of Object.values(terrainMaterials))material.wireframe=wireframe;plainWaterMaterial.wireframe=wireframe;movingWaterMaterial.wireframe=wireframe};

$('shores').onchange=e=>{lines.visible=e.target.checked};
const PRESETS={

 incised:{width:7.5,depth:1.4,rise:1.8,bankWidth:2,shoulder:7,headLength:45,outletLength:55},
 lowland:{width:16,depth:1.2,rise:.5,bankWidth:5.5,shoulder:22,headLength:80,outletLength:90}

const PARAMS=['width','depth','rise','bankWidth','shoulder','headLength','outletLength'];
function drawCrossSection(){

 lines.clear();
 for(const side of [-1,1]){
  const points=[];
  for(let i=0;i<=RIVER_STEPS;i++){
   const z=longitudinalSample(i),[x,,zz]=waterPosition(z,side);
   points.push([x,centerY(z)+.075,zz]);
  }
  lineStrip(points,0xfbe3a5);
 }
 lines.visible=$('shores').checked;
 drawCrossSection();audit();
}
function syncUI(){
 for(const key of PARAMS){
  $(key).value=geom[key];
  $(key+'Value').textContent=Number(geom[key]).toFixed(key==='width'||key==='depth'||key==='rise'||key==='bankWidth'||key==='shoulder'?1:0)+' m';
 }
 $('endMode').value=geom.mode;
 $('headSource').value=geom.source;
 $('headSource').disabled=!hasHead();
}
$('preset').onchange=e=>{
 Object.assign(geom,PRESETS[e.target.value]);
 geom.source=e.target.value==='stream'?'spring':'taper';
 syncUI();rebuildGeometry();
};
$('endMode').onchange=e=>{geom.mode=e.target.value;syncUI();rebuildGeometry()};
$('headSource').onchange=e=>{geom.source=e.target.value;rebuildGeometry()};
for(const key of PARAMS)$(key).onchange=e=>{
 geom[key]=Number(e.target.value);syncUI();rebuildGeometry();
};
function audit(){
 let count=0,minDepth=Infinity,maxDepth=-Infinity,uphill=0;
 const end=hasOutlet()?POND_END:RIVER_END;
 for(let i=0;i<=RIVER_STEPS;i++){
  const z=longitudinalSample(i);
  if(i&&centerY(z)>centerY(longitudinalSample(i-1))+.00001)uphill++;
  for(const side of [-1,0,1]){
   const [x,y,zz]=waterPosition(z,side);
   const diff=y-groundHeight(x,zz);
   if(!Number.isFinite(diff))throw Error('Non-finite ground elevation');
   count++;minDepth=Math.min(minDepth,diff);maxDepth=Math.max(maxDepth,diff);
  }
 }
 $('testreadout').textContent='Controlled river geometry · '+geom.width.toFixed(1)+' m main-channel width · '+
 (end-RIVER_START).toFixed(0)+' m extent · '+geom.depth.toFixed(1)+' m depth · '+geom.rise.toFixed(1)+
 ' m bank rise · '+water.geometry.index.count/3+' water triangles · '+land.geometry.index.count/3+
 ' land triangles · '+uphill+' uphill steps. Sampled water clearance '+minDepth.toFixed(2)+
 '–'+maxDepth.toFixed(2)+' m. '+(hasHead()?(isSmall()?'Source: '+geom.source+'. ':'Headwater taper. '):'')+
 (hasOutlet()?'Outlet widens into an enclosed test pond.':'Blunt downstream test boundary.')+
 ' No fluid simulation.';
 const color=land.geometry.getAttribute('color'),uv=water.geometry.getAttribute('uv');
 $('debugreadout').textContent='Vertex colors: '+(color?color.count:'missing')+
 ' · water UVs: '+(uv?uv.count:'missing')+' · animated surface: single reusable 128×256 texture.';
}
syncUI();drawCrossSection();audit();view('bank');
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
window.addEventListener('resize',resize);
const animationClock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,animationClock.getDelta());
 if(waterMotion&&waterTextureEnabled)riverTexture.offset.y=(riverTexture.offset.y-dt*.032)%1;
 controls.update();renderer.render(scene,camera);
});
}catch(err){$('error').style.display='block';$('error').textContent='River lab error: '+String(err);throw err}
</script></body></html>
