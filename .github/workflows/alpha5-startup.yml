name: Alpha 5 startup check
on:
  push:
    branches: [alpha5-integrated-geography]
    paths:
      - 'index.html'
      - 'world-generation.js'
      - 'terrain-mesh.js'
      - 'tests/alpha5-startup.mjs'
      - '.github/workflows/alpha5-startup.yml'
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test game start in mobile browser
        run: |
          python3 -m http.server 8123 >/tmp/horizon-server.log 2>&1 &
          node tests/alpha5-startup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha5-startup
          path: alpha5-startup.png
          if-no-files-found: ignore
