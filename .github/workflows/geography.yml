name: Geography regression
on:
  push:
    branches: [main, alpha4-unified-geography]
  pull_request:
    paths:
      - 'geography.js'
      - 'index.html'
      - 'river-lab.html'
      - 'tests/**'
      - 'package.json'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run geography unit tests
        run: npm test
      - name: Check browser inline module syntax
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,unlinkSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          for(const file of ['index.html','river-lab.html']){
            const html=readFileSync(file,'utf8');
            const match=html.match(/<script type="module">([\s\S]*?)<\/script>/);
            if(!match) throw new Error('Missing inline module in '+file);
            const out=file+'.syntax.mjs';
            writeFileSync(out,match[1]);
            const result=spawnSync(process.execPath,['--check',out],{stdio:'inherit'});
            unlinkSync(out);
            if(result.status!==0)process.exit(result.status||1);
          }
          NODE
